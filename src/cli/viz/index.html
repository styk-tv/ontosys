<!DOCTYPE html>
<html lang="en" data-theme="medium">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OntoSys Explorer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%224%22 cy=%224%22 r=%223%22 fill=%22%232f6fd6%22/%3E%3Ccircle cx=%2212%22 cy=%227%22 r=%223%22 fill=%22%230f8b8d%22/%3E%3Ccircle cx=%226%22 cy=%2213%22 r=%222.5%22 fill=%22%23e8823a%22/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root, [data-theme="medium"] {
  --bg: #9aa1aa; --panel: #bcc2c9; --panel-2: #b0b7bf; --text: #111418; --muted: #383f48;
  --border: #8c939c; --canvas: #c6cbd1; --edge: #7a828c; --accent: #163f8a; --chip: #a7aeb7;
  --stroke: #eef0f2; --shadow: 0 1px 3px rgba(0,0,0,.18);
}
[data-theme="light"] {
  --bg: #eef0f3; --panel: #ffffff; --panel-2: #f3f5f7; --text: #1f2328; --muted: #59636e;
  --border: #d5dbe1; --canvas: #fafbfc; --edge: #b6bec8; --accent: #0b62d6; --chip: #e8ecf0;
  --stroke: #ffffff; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
[data-theme="dark"] {
  --bg: #0d1117; --panel: #161b22; --panel-2: #1c2129; --text: #e6edf3; --muted: #8b949e;
  --border: #30363d; --canvas: #0d1117; --edge: #353c45; --accent: #58a6ff; --chip: #21262d;
  --stroke: #0d1117; --shadow: 0 1px 3px rgba(0,0,0,.5);
}
:root { --added: #1f9d55; --removed: #d1242f; --changed: #c48a00; --moved: #7b4fd0; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text); display: flex; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

/* ---- sidebar ---- */
#side { width: 420px; min-width: 340px; background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; height: 100%; }
#head { padding: 12px 14px 8px; border-bottom: 1px solid var(--border); }
#brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#brand h1 { margin: 0; font-size: 16px; color: var(--accent); }
#brand .sub { color: var(--muted); font-size: 12px; }
#numbers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 12px; margin-top: 8px; }
#numbers div b { display: block; font-size: 17px; }
#numbers div span { color: var(--muted); font-size: 11px; }
#tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--panel-2); }
#tabs button { flex: 1; padding: 8px 4px; border: 0; background: transparent; cursor: pointer;
  border-bottom: 2px solid transparent; color: var(--muted); }
#tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tab { display: none; overflow-y: auto; flex: 1; padding: 12px 14px 24px; }
.tab.on { display: block; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.muted { color: var(--muted); }
.small { font-size: 11px; }

/* search */
#searchwrap { position: relative; }
#search { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); }
#results { position: absolute; z-index: 5; left: 0; right: 0; top: 38px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); max-height: 360px; overflow-y: auto; display: none; }
#results .row { padding: 6px 10px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
#results .row:hover, #results .row.hl { background: var(--panel-2); }

/* nav */
#nav { display: flex; align-items: center; gap: 6px; margin: 10px 0 4px; }
#nav button { border: 1px solid var(--border); background: var(--panel-2); border-radius: 5px; padding: 2px 8px; cursor: pointer; }
#nav button:disabled { opacity: .4; cursor: default; }
#crumbs { display: flex; gap: 4px; overflow: hidden; white-space: nowrap; flex: 1; }
#crumbs span { cursor: pointer; color: var(--muted); font-size: 11px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
#crumbs span:hover { color: var(--accent); }

/* card */
.card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
.card h2 { margin: 0 0 4px; font-size: 16px; word-break: break-word; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--chip); border: 1px solid var(--border); }
.badge.kind { color: #fff; border: 0; }
.status { font-size: 11px; padding: 1px 7px; border-radius: 10px; color: #fff; }
.status.added { background: var(--added); } .status.removed { background: var(--removed); }
.status.changed { background: var(--changed); } .status.moved { background: var(--moved); }
.iri { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); word-break: break-all; }
.ground { border-left: 3px solid var(--accent); padding: 4px 8px; margin: 6px 0; background: var(--panel); border-radius: 0 6px 6px 0; }
.ground b { font-size: 12px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 3px 10px; font-size: 12px; }
.kv .k { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.kv .v { word-break: break-word; }
.kv .v.clip { max-height: 4.4em; overflow: hidden; cursor: pointer; }
.group { margin-top: 6px; }
.ghead { display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 3px 0; }
.ghead .p { font-weight: 600; }
.ghead .n { color: var(--muted); font-size: 11px; }
.ghead button { margin-left: auto; font-size: 11px; border: 1px solid var(--border); background: var(--panel); border-radius: 4px; cursor: pointer; padding: 0 6px; }
.items { padding-left: 4px; }
.item { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
.item:hover { background: var(--panel); }
.item .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .k { color: var(--muted); font-size: 10px; margin-left: auto; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; border: 1.5px solid transparent; }
.more { font-size: 11px; color: var(--accent); cursor: pointer; padding: 2px 4px; }
.change { font-size: 12px; margin: 4px 0; }
.change .p { color: var(--muted); }
.change .rm { color: var(--removed); } .change .ad { color: var(--added); }
.change code { font-size: 11px; background: var(--panel); padding: 0 3px; border-radius: 3px; word-break: break-word; }
.actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.actions button, .btn { border: 1px solid var(--border); background: var(--panel); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
.actions button:hover, .btn:hover { border-color: var(--accent); }
.empty { color: var(--muted); padding: 16px 0; }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); padding: 3px 4px; }
td { border-bottom: 1px solid var(--border); padding: 3px 4px; vertical-align: top; word-break: break-word; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
td .go { color: var(--accent); cursor: pointer; }
.agg { margin-bottom: 14px; }
.agg h4 { margin: 0 0 2px; font-size: 13px; }
.cnt { cursor: pointer; color: var(--accent); }
.cnt.zero { color: var(--muted); cursor: default; }
textarea { width: 100%; min-height: 150px; font: 12px ui-monospace, Menlo, monospace; padding: 8px;
  border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); }
select { border: 1px solid var(--border); background: var(--panel-2); border-radius: 5px; padding: 3px; max-width: 100%; }

/* ---- canvas ---- */
#main { flex: 1; position: relative; background: var(--canvas); }
svg#graph { width: 100%; height: 100%; display: block; }
.link { stroke: var(--edge); stroke-opacity: .7; }
.link.removed { stroke: var(--removed); stroke-dasharray: 3 3; }
.link.added { stroke: var(--added); }
.link.hl { stroke: var(--accent); stroke-opacity: 1; stroke-width: 1.6; }
.node circle.v { stroke: var(--stroke); stroke-width: 1; pointer-events: none; }
.node circle.hit { fill: transparent; stroke: none; cursor: pointer; }
.node.removed circle.v { fill-opacity: .45; }
.delta-on .node.st-added circle.v { stroke: var(--added); stroke-width: 3; }
.delta-on .node.st-removed circle.v { stroke: var(--removed); stroke-width: 3; stroke-dasharray: 2 1; }
.delta-on .node.st-changed circle.v { stroke: var(--changed); stroke-width: 3; }
.delta-on .node.st-moved circle.v { stroke: var(--moved); stroke-width: 3; }
.delta-only .node.st-unchanged:not(.sel):not(.pin) { opacity: .12; }
.delta-only .link:not(.hl):not(.added):not(.removed) { opacity: .1; }
.node.sel circle.v { stroke: var(--accent) !important; stroke-width: 4 !important; stroke-dasharray: none !important; }
.node text { font-size: 9px; fill: var(--text); pointer-events: none; display: none;
  paint-order: stroke; stroke: var(--canvas); stroke-width: 3px; }
.labels-all .node text, .labels-auto.zoomed .node text, .labels-auto .node.pin text, .labels-all .node.pin text { display: block; }
.labels-none .node:not(.sel) text { display: none !important; }
.node.dim { opacity: .25; }
#toolbar { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); }
.seg button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }
#legend { position: absolute; left: 10px; bottom: 10px; max-height: 30%; overflow-y: auto; background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; box-shadow: var(--shadow); max-width: 58%; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; }
#legend span { display: flex; align-items: center; gap: 4px; cursor: pointer; }
#legend span.off { opacity: .35; }
#tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 8px; font-size: 12px; box-shadow: var(--shadow); display: none; max-width: 360px; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }
#mode { position: absolute; right: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 11px; box-shadow: var(--shadow); max-width: 32%; }
</style>
</head>
<body>
<aside id="side">
  <div id="head">
    <div id="brand"><h1>OntoSys</h1><span class="sub" id="subtitle"></span></div>
    <div id="numbers"></div>
  </div>
  <div id="tabs">
    <button data-tab="explore" class="on">Explore</button>
    <button data-tab="stats">Stats</button>
    <button data-tab="delta" id="tab-delta-btn">Delta</button>
    <button data-tab="sparql">SPARQL</button>
  </div>
  <section class="tab on" id="tab-explore">
    <div id="searchwrap">
      <input id="search" placeholder="Search everything (functions, catalogs, settings, SQLSTATEs…)" autocomplete="off">
      <div id="results"></div>
    </div>
    <div id="nav"><button id="back" title="Back">◀</button><button id="fwd" title="Forward">▶</button><div id="crumbs"></div></div>
    <div id="detail"><div class="empty">Click a node on the canvas, or search. Every link in this panel is a step you can take: it brings the target onto the canvas and focuses it.</div></div>
  </section>
  <section class="tab" id="tab-stats"><div class="empty">Loading…</div></section>
  <section class="tab" id="tab-delta"><div class="empty">Start the explorer with <code>--compare &lt;other build&gt;</code> to see a delta.</div></section>
  <section class="tab" id="tab-sparql">
    <select id="examples"><option value="">Examples…</option></select>
    <textarea id="query" spellcheck="false"></textarea>
    <div class="actions"><button id="run">Run (Ctrl+Enter)</button><span class="muted small" id="qstatus"></span></div>
    <div id="qresult"></div>
  </section>
</aside>
<div id="main">
  <svg id="graph"></svg>
  <div id="mode"></div>
  <div id="toolbar">
    <div class="seg" id="viewmode"><button data-v="all" title="Everything drawn so far">View: all</button><button data-v="trail" title="Only the selections you walked through, plus the current one's neighbours">trail</button><button data-v="focus" title="Only the current selection and its neighbours">focus</button></div>
    <div class="seg" id="theme"><button data-v="light">Light</button><button data-v="medium">Medium</button><button data-v="dark">Dark</button></div>
    <div class="seg" id="labels"><button data-v="auto">Labels: auto</button><button data-v="all">all</button><button data-v="none">off</button></div>
    <div class="seg" id="deltaseg" style="display:none"><button data-v="on" title="Colour nodes by their change">Delta</button><button data-v="only" title="Dim unchanged nodes">Changed only</button></div>
    <div class="seg"><button id="fit">Fit</button><button id="relayout" title="Recompute the layout of what is drawn">Relayout</button><button id="clearx" title="Remove nodes added by exploring">Reset</button></div>
  </div>
  <div id="legend"></div>
  <div id="tip"></div>
  <div id="loading">Loading graph…</div>
</div>
<script>
(() => {
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = (path, params) => fetch(path + (params ? '?' + new URLSearchParams(params) : '')).then(r => r.json());
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const fmt = n => Number(n).toLocaleString();

// ---------------------------------------------------------------- colours
const KIND = {
  'pg:BackendSubsystem': '#e8823a', 'pg:ClientProgram': '#d0651c', 'pg:ClientLibrary': '#c3942a',
  'pg:ProceduralLanguage': '#cfa936', 'pg:Extension': '#9563d4', 'pg:TestModule': '#7f8893',
  'pg:SharedCode': '#bf9a35', 'pg:PublicHeaders': '#a2762a', 'pg:CodeArea': '#8f98a2',
  'pg:SystemCatalog': '#2f6fd6', 'pg:CatalogColumn': '#5d9fe6', 'pg:NodeType': '#0f8b8d',
  'pg:SQLState': '#df5b55', 'pg:SQLStateClass': '#b4342f', 'pg:BuiltinFunction': '#c0589f',
  'pg:DataType': '#a64f9a', 'pg:Operator': '#8e4aa8', 'pg:ConfigParameter': '#d27c2c',
  'pg:Hook': '#b8860b', 'pg:WaitEvent': '#6e8b3d', 'pg:LWLock': '#5f7a33', 'pg:Keyword': '#7a7a7a',
  'cx:Function': '#6a5acd', 'cx:Struct': '#4677c9', 'cx:Field': '#6b93d6', 'cx:SourceFile': '#8d7f62',
  'cx:HeaderFile': '#a08a5c', 'cx:ExternalSymbol': '#9a9a9a', 'cx:Macro': '#a3779a', 'cx:Prototype': '#5a8f7d',
};
const kindColor = k => KIND[k] || (String(k).startsWith('pg:') ? '#7d63b8' : String(k).startsWith('cx:') ? '#3f8f8f' : '#8b949e');
const short = k => String(k || '').replace(/^(pg|cx|pgcat|rdfs?|owl):/, '');
const statusDot = s => s && s !== 'unchanged' ? `<span class="status ${s}">${s}</span>` : '';

// ---------------------------------------------------------------- state
const S = { info: {}, nodes: new Map(), links: [], linkKeys: new Set(), sel: null, hist: [], hpos: -1,
            req: 0, mode: 'all', nbrs: new Set(), pinned: null, sig: '',
            hidden: new Set(), base: new Set(), delta: false, deltaOnly: false };

// ---------------------------------------------------------------- theme / toggles
function setTheme(v) { document.documentElement.dataset.theme = v; store.set('ontosys-theme', v);
  document.querySelectorAll('#theme button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
setTheme(store.get('ontosys-theme') || 'medium');
document.querySelectorAll('#theme button').forEach(b => b.onclick = () => setTheme(b.dataset.v));
function setLabels(v) { const svg = $('#graph'); svg.classList.remove('labels-auto', 'labels-all', 'labels-none');
  svg.classList.add('labels-' + v); store.set('ontosys-labels', v);
  document.querySelectorAll('#labels button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
setLabels(store.get('ontosys-labels') || 'auto');
document.querySelectorAll('#labels button').forEach(b => b.onclick = () => setLabels(b.dataset.v));
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => showTab(b.dataset.tab));
let allLayout = null;   // positions of the All view while trail/focus lay out on their own
function setMode(v, redraw = true) {
  const prev = S.mode;
  if (redraw && prev === 'all' && v !== 'all') {
    allLayout = new Map([...S.nodes.values()].map(n => [n.iri, [n.x, n.y]]));
    thawAll();
  }
  if (redraw && prev !== 'all' && v === 'all' && allLayout) {
    for (const n of S.nodes.values()) { const p = allLayout.get(n.iri); if (p) { n.x = p[0]; n.y = p[1]; } }
    freezeAll(); allLayout = null;
  }
  S.mode = v; store.set('ontosys-view', v); layoutFor(v);
  document.querySelectorAll('#viewmode button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (!redraw) return;
  if (v !== 'all' && current) addNeighbours(current);
  draw(true);
  if (v === 'all' && S.sel) focusNode(S.sel);
}
document.querySelectorAll('#viewmode button').forEach(b => b.onclick = () => setMode(b.dataset.v));
function showTab(t) { document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + t)); }
function setDelta(on, only) { S.delta = on; S.deltaOnly = only;
  const svg = $('#graph'); svg.classList.toggle('delta-on', on); svg.classList.toggle('delta-only', only);
  $('#deltaseg [data-v=on]').classList.toggle('on', on); $('#deltaseg [data-v=only]').classList.toggle('on', only); }
$('#deltaseg [data-v=on]').onclick = () => setDelta(!S.delta, S.deltaOnly && !S.delta);
$('#deltaseg [data-v=only]').onclick = () => setDelta(true, !S.deltaOnly);

// ---------------------------------------------------------------- canvas
const svg = d3.select('#graph');
const root = svg.append('g');
const gLinks = root.append('g'), gNodes = root.append('g');
let width = 0, height = 0;
const zoom = d3.zoom().scaleExtent([0.05, 8]).on('zoom', e => {
  root.attr('transform', e.transform);
  $('#graph').classList.toggle('zoomed', e.transform.k >= 3.5);
});
svg.call(zoom).on('dblclick.zoom', null);
const sim = d3.forceSimulation()
  .force('link', d3.forceLink().id(d => d.iri).distance(34).strength(.5))
  .force('charge', d3.forceManyBody().strength(-45).distanceMax(380))
  .force('collide', d3.forceCollide(7))
  .force('x', d3.forceX().strength(.035)).force('y', d3.forceY().strength(.035))
  .on('tick', ticked)
  .on('end', () => { if (S.mode === 'all') freezeAll(); else fit(60, 500); });
function layoutFor(mode) {
  const roomy = mode !== 'all';
  sim.force('link').distance(roomy ? 110 : 34).strength(roomy ? .7 : .5);
  sim.force('charge').strength(roomy ? -320 : -45).distanceMax(roomy ? 900 : 380);
  sim.force('collide').radius(roomy ? 28 : 7);
  sim.alphaDecay(roomy ? .05 : .0228);
}
function freezeAll() { for (const n of S.nodes.values()) if (n.x != null) { n.fx = n.x; n.fy = n.y; } }
function thawAll() { for (const n of S.nodes.values()) { n.fx = null; n.fy = null; } }
function resize() { const r = $('#main').getBoundingClientRect(); width = r.width; height = r.height; }
window.addEventListener('resize', resize); resize();

let linkSel = gLinks.selectAll('line'), nodeSel = gNodes.selectAll('g');
function visibleNodes() {
  let nodes = [...S.nodes.values()].filter(n => !S.hidden.has(n.kind));
  if (S.mode !== 'all' && S.sel) {
    const keep = new Set(S.nbrs); keep.add(S.sel);
    if (S.mode === 'trail') S.hist.slice(0, S.hpos + 1).forEach(i => keep.add(i));
    nodes = nodes.filter(n => keep.has(n.iri));
  }
  return nodes;
}
// reheat: true = force a relayout; otherwise only when nodes/links were added or removed
function draw(reheat = false) {
  const nodes = visibleNodes();
  const ids = new Set(nodes.map(n => n.iri));
  const links = S.links.filter(l => ids.has(id(l.source)) && ids.has(id(l.target)));
  linkSel = gLinks.selectAll('line').data(links, l => id(l.source) + '|' + l.p + '|' + id(l.target))
    .join('line').attr('class', l => 'link ' + (l.status || ''))
    .classed('hl', l => S.sel && (id(l.source) === S.sel || id(l.target) === S.sel));
  nodeSel = gNodes.selectAll('g.node').data(nodes, d => d.iri).join(enter => {
    const g = enter.append('g').attr('class', 'node')
      .call(d3.drag().on('start', dragStart).on('drag', dragged).on('end', dragEnd))
      .on('click', (e, d) => { e.stopPropagation(); go(d.iri); })
      .on('mouseover', (e, d) => tip(e, d)).on('mousemove', (e, d) => tip(e, d)).on('mouseout', () => $('#tip').style.display = 'none');
    g.append('circle').attr('class', 'hit').attr('r', 11);
    g.append('circle').attr('class', 'v');
    g.append('text').attr('x', 8).attr('y', 3);
    return g;
  });
  nodeSel.attr('class', d => `node st-${d.status || 'unchanged'}${d.status === 'removed' ? ' removed' : ''}${S.sel === d.iri ? ' sel' : ''}${d.pin ? ' pin' : ''}`);
  nodeSel.select('circle.v').attr('r', d => d.iri === S.sel ? 8 : (d.explored ? 6 : 4.5)).attr('fill', d => kindColor(d.kind));
  nodeSel.select('text').text(d => d.label || d.short);

  if ($('#dprev')) $('#dprev').onclick = () => deltaList(cls, status, title, Math.max(0, offset - 60));
  if ($('#dnext')) $('#dnext').onclick = () => deltaList(cls, status, title, offset + 60);
  $('#dlist').scrollIntoView({ behavior: 'smooth' });
}

// ---------------------------------------------------------------- sparql
$('#query').value = `PREFIX pg: <https://ontosys.io/ns/pg#>
PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
SELECT ?sqlstate (COUNT(DISTINCT ?f) AS ?functions) WHERE {
  ?f pg:mayRaise ?sqlstate
} GROUP BY ?sqlstate ORDER BY DESC(?functions) LIMIT 20`;
$('#examples').onchange = e => { if (e.target.value) { $('#query').value = e.target.value; runQuery(); } };
$('#run').onclick = () => runQuery();
$('#query').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runQuery(); } });
async function runQuery() {
  $('#qstatus').textContent = 'running…';
  const r = await fetch('/api/sparql?limit=2000', { method: 'POST', body: $('#query').value }).then(x => x.json());
  if (r.error) { $('#qstatus').textContent = ''; $('#qresult').innerHTML = `<div class="card" style="color:var(--removed)">${esc(r.error)}</div>`; return; }
  if (r.kind === 'ask') { $('#qstatus').textContent = `${r.elapsed_ms} ms`; $('#qresult').innerHTML = `<div class="card"><b>${r.boolean}</b></div>`; return; }
  $('#qstatus').textContent = `${fmt(r.rows.length)} rows${r.truncated ? ' (truncated)' : ''} · ${r.elapsed_ms} ms`;
  $('#qresult').innerHTML = tableHtml(r.vars, r.rows);
  bindGo($('#qresult'));
}

// ---------------------------------------------------------------- boot
async function boot() {
  setMode(store.get('ontosys-view') || 'all', false);
  S.info = await api('/api/info');
  $('#subtitle').textContent = `${S.info.project || ''} ${S.info.version || ''}${S.info.baseline ? ' · compared with ' + S.info.baseline : ''}`;
  const v = await api('/api/view');
  for (const n of v.nodes) { S.nodes.set(n.iri, { ...n }); S.base.add(n.iri); }
  for (const e of v.edges) addLink(e.source, e.p, e.target, e.status);
  $('#mode').innerHTML = v.mode === 'overview'
    ? `Overview: grounded structure (${fmt(v.nodes.length)} of ${fmt(S.info.triples)} triples' entities). Search or travel links to bring in anything else.`
    : `Full graph (${fmt(v.nodes.length)} entities).`;
  $('#loading').style.display = 'none';
  draw();
  setTimeout(() => fit(40, 800), 2500);
  loadStats(); loadDelta();
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith('http')) go(h);
}
boot();
})();
</script>
